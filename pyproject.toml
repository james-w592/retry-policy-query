[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retryq"
version = "0.1.0"
description = "Query tool for retry policy files: will this attempt retry, and when?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "james-w592" }]

[project.scripts]
retryq = "retryq.cli:main"

[tool.setuptools.packages.find]
include = ["retryq*"]
